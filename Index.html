<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROBOTBOY</title>
<style>
:root{--bg:#f7f5ef;--sf:#fff;--tx:#1d1c19;--mu:#6c685d;--ln:#ddd9cd;--ac:#c2571a;--ok:#2e7d4f;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--sf:#1e1c19;--tx:#edebe5;--mu:#9d998d;--ln:#35322c;--ac:#ec8a56;--ok:#5fb582;--bad:#e5675a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--sf:#1e1c19;--tx:#edebe5;--mu:#9d998d;--ln:#35322c;--ac:#ec8a56;--ok:#5fb582;--bad:#e5675a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font:700 22px Georgia,serif;margin:0}
.s{color:var(--mu);font-size:13px;margin:2px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:9px 12px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.c h2,.c h3{margin:0 0 6px;font-size:17px}
.m{font-size:12px;color:var(--mu)}
ul,ol{margin:6px 0;padding-left:20px}
li{margin:3px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sg{text-align:center}
.sg svg{width:84px;height:84px}
.sg p{font-size:13px;margin:4px 0 0}
.note{border-left:4px solid var(--ac);background:var(--sf);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--mu);margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font:700 40px Georgia,serif}
.qs{text-align:center}.qs svg{width:110px;height:110px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="w">
<h1 style="display:flex;align-items:center;gap:12px;letter-spacing:1px"><svg width="60" height="88" viewBox="0 -17 56 82" role="img" aria-label="ROBOTBOY logo: a traffic light with arms and legs" style="color:var(--tx)"><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 20L6 30L4 38"/><path d="M41 20L50 30L52 38"/><path d="M22 50V62H15"/><path d="M34 50V62H41"/></g><circle cx="4" cy="39" r="3" fill="currentColor"/><circle cx="52" cy="39" r="3" fill="currentColor"/><rect x="15" y="3" width="26" height="48" rx="9" fill="#262421" stroke="#8a857a" stroke-width="1.5"/><circle cx="28" cy="14" r="6" fill="#e5392c"/><circle cx="28" cy="27" r="6" fill="#f5b414"/><circle cx="28" cy="40" r="6" fill="#2fb457"/><path d="M18 4C16 -10 40 -10 38 4Z" fill="#c9a766" stroke="#8a6a30" stroke-width="1.2"/><path d="M18 -1Q28 -4 38 -1" stroke="#1f7a3d" stroke-width="3" fill="none"/><path d="M18 1.5Q28 -1.5 38 1.5" stroke="#f2b705" stroke-width="1.5" fill="none"/><path d="M3 8Q6 -1 18 2L38 2Q50 -1 53 8Q40 11 28 11Q16 11 3 8Z" fill="#d8b878" stroke="#8a6a30" stroke-width="1.2" stroke-linejoin="round"/></svg>ROBOTBOY</h1>
<p class="s">Namibian road rules, traffic signs and vehicle operation, with a 300-mark exam</p>
<button class="pri" onclick="share()" style="margin-bottom:10px">🔗 Share with a friend</button><div id="shm" class="m" style="margin-bottom:10px"></div>
<nav id="nav"></nav>
<div id="v"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function sig(k){
var R='fill="#fff" stroke="#d62828" stroke-width="7"',B='fill="#1b5fb5"',P='fill="#fff" stroke="#fff"';
var m={
stop:'<polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#d62828"/><text x="50" y="58" font-size="26" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">STOP</text>',
give:'<polygon points="8,12 92,12 50,90" '+R+' stroke-linejoin="round"/>',
noentry:'<circle cx="50" cy="50" r="44" fill="#d62828"/><rect x="20" y="42" width="60" height="16" fill="#fff"/>',
speed60:'<circle cx="50" cy="50" r="42" '+R+'/><text x="50" y="62" font-size="36" font-weight="700" text-anchor="middle" fill="#111" font-family="Arial">60</text>',
ped:'<polygon points="50,8 94,88 6,88" '+R+' stroke-linejoin="round"/><circle cx="50" cy="42" r="6" fill="#111"/><path d="M50 49v18M50 54l-9 8M50 54l9 8M50 67l-7 12M50 67l7 12" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>',
round:'<polygon points="50,8 94,88 6,88" '+R+' stroke-linejoin="round"/><circle cx="50" cy="60" r="14" fill="none" stroke="#111" stroke-width="5"/><path d="M50 46l-7 -5M50 46l-7 7" stroke="#111" stroke-width="4"/>',
one:'<rect x="6" y="6" width="88" height="88" rx="10" '+B+'/><path d="M50 78V30M32 46l18-18 18 18" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
park:'<rect x="6" y="6" width="88" height="88" rx="10" '+B+'/><text x="50" y="72" font-size="60" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">P</text>',
animals:'<polygon points="50,8 94,88 6,88" '+R+' stroke-linejoin="round"/><text x="50" y="76" font-size="34" text-anchor="middle">🐄</text>',
lights:'<polygon points="50,8 94,88 6,88" '+R+' stroke-linejoin="round"/><rect x="40" y="30" width="20" height="50" rx="5" fill="#222"/><circle cx="50" cy="40" r="5" fill="#e33"/><circle cx="50" cy="55" r="5" fill="#fb0"/><circle cx="50" cy="70" r="5" fill="#2b4"/>'};
return '<svg viewBox="0 0 100 100" role="img">'+m[k]+'</svg>'}
var S=[["stop","Stop completely at the line and give way to all traffic"],["give","Give way to traffic on the road you are entering"],["noentry","No entry for vehicles"],["speed60","Maximum speed 60 km/h"],["ped","Pedestrian crossing ahead"],["round","Roundabout ahead"],["one","One-way street"],["park","Parking area"],["animals","Animals may be on the road"],["lights","Traffic lights ahead"]];
var RU=[
["Drive on the left side of the road","Namibia drives on the left. Overtake on the right when it is safe and legal.",["Drive on the left","Drive on the right","Drive in the middle","Either side"],0],
["At a roundabout","Slow down and give way to traffic already in the circle, which comes from your right. Go clockwise.",["Give way to traffic from the right","Give way to traffic from the left","Always stop","Hoot and enter"],0],
["At a four-way stop","Everyone stops. The first vehicle to arrive goes first; if you arrive together, give way to the vehicle on your right.",["First to arrive goes first","Biggest vehicle goes first","Fastest goes first","Vehicle on the left goes first"],0],
["Seat belts","Driver and passengers must wear seat belts wherever they are fitted.",["Driver only","Front seat only","Driver and all passengers","Only on highways"],2],
["Cellphone use","Do not hold a cellphone while driving. Pull over safely or use a hands-free kit.",["Allowed in town","Not allowed handheld","Allowed on gravel","Allowed when stopped in traffic"],1],
["Usual speed limit in built-up areas","Unless a sign says otherwise, built-up areas are limited to 60 km/h.",["40 km/h","60 km/h","80 km/h","100 km/h"],1],
["Usual maximum speed on tarred open roads","The general maximum is 120 km/h unless signs show less. Gravel roads need much lower speeds.",["80 km/h","100 km/h","120 km/h","140 km/h"],2],
["Safe following distance in good conditions","Keep at least a 3-second gap, and more on gravel, in rain or when towing.",["1 second","3 seconds or more","Bumper to bumper","Half a second"],1],
["Driving at night on rural roads","Livestock and wildlife are common. Slow down, use high beam when clear and avoid long night trips.",["Speed up to arrive sooner","Slow down and watch for animals","Switch off lights","Follow a truck closely"],1],
["After drinking alcohol","Alcohol slows reactions and judgement. Never drink and drive; use a sober driver or taxi.",["Drive slowly","Drive after coffee","Do not drive","Drive only short distances"],2]];
var VQ=[
["Before starting any vehicle or machine","A walk-round check of tyres or tracks, fluids, lights, leaks and damage prevents most breakdowns and accidents.",["Do a walk-round safety check","Start and listen to it","Check only the fuel","Skip if it ran yesterday"],0],
["Changing gear in a manual car","Press the clutch fully down before moving the gear lever.",["Press the clutch fully","Press the brake only","Lift the handbrake","Turn the wheel"],0],
["Parking an excavator","Lower the bucket to the ground, switch off, remove the key and apply the safety lock.",["Leave the bucket raised","Lower the bucket to the ground","Park on a slope","Leave the engine running"],1],
["Travelling with a wheel loader","Carry the bucket low and tilted back to keep the machine stable and the view clear.",["Bucket high","Bucket low and tilted back","Bucket fully raised and dumped","Bucket on the ground, dragging"],1],
["Forklift with a load blocking forward view","Travel in reverse, with a spotter if needed. Keep forks low.",["Drive faster","Travel in reverse","Raise the load","Drive with one hand"],1],
["Motorcycle safety","Wear an approved helmet, eye protection and bright, protective clothing.",["Helmet only on highways","Helmet always","No helmet in town","Helmet for passengers only"],1],
["Loaded trucks and buses","More weight means a longer stopping distance. Increase following gap and brake early.",["Stop faster","Stopping distance is longer","Same as a car","Brakes work better when heavy"],1],
["Working near a bulldozer or grader","Stay clear of the blade, stay in the operator’s view and use a spotter.",["Stand next to the blade","Stay clear and use a spotter","Walk behind it","Stand in its blind spot"],1],
["Driving on a steep slope","Go straight up or down. Avoid turning or driving across the slope, which risks a rollover.",["Drive straight up or down","Drive across the slope","Turn sharply on the slope","Reverse downhill quickly"],0],
["Before tipping a dump truck","Park on firm, level ground and check overhead power lines and people nearby.",["Tip on any slope","Check level ground and overhead lines","Tip while driving","Tip near power lines"],1]];
var V=[
{n:"Car (manual)",i:"🚗",c:"Pedals: clutch, brake, accelerator. Gear lever, handbrake, mirrors.",s:["Adjust seat, mirrors and belt","Clutch down, select first, handbrake off","Raise clutch to the bite point and add gentle throttle","Mirror, signal, then move off; change up smoothly"],f:["Check blind spots","Keep a 3-second gap","Never use a handheld phone"]},
{n:"Motorcycle",i:"🏍️",c:"Throttle, front brake, rear brake, clutch lever, foot gear shifter.",s:["Put on helmet and protective gear","Check tyres, chain, lights and brakes","Clutch in, first gear, ease out the clutch with throttle","Brake with both brakes; lean, don’t steer, to corner"],f:["Be visible","Slow on gravel and sand","Watch for livestock"]},
{n:"Bus / heavy truck",i:"🚛",c:"Air brakes, multi-gear gearbox, large mirrors, long wheelbase.",s:["Check air pressure, tyres and load security","Select gear and release the parking brake","Swing wide on turns to protect the trailer","Brake early and use engine braking downhill"],f:["Blind spots are large","Keep a longer gap","Rest on long trips"]},
{n:"Dump truck",i:"🏗️",c:"Tipping lever, body-up indicator, retarder or exhaust brake.",s:["Inspect hoist, tyres and body","Load evenly and do not overload","Drive with the body fully down","Tip on level ground, then lower before moving"],f:["Check overhead power lines","Keep people clear while tipping","Never drive with the body raised"]},
{n:"Tractor",i:"🚜",c:"PTO lever, hydraulic lift, differential lock, clutch and brakes.",s:["Check hitch, guards and ROPS","Engage the clutch smoothly","Hitch implements low and on the drawbar","Turn at low speed and keep to level ground"],f:["Rollover is the main risk","Disengage PTO before leaving the seat","No passengers"]},
{n:"Wheel loader",i:"🚧",c:"Joystick or levers for lift and tilt, articulated steering, forward and reverse selector.",s:["Check the bucket, pins, hoses and tyres","Lower the bucket before moving","Approach the pile square and fill the bucket","Carry low and tilted back, then dump slowly"],f:["Use a spotter in reverse","Keep a stable load","Park with the bucket on the ground"]},
{n:"Excavator",i:"⛏️",c:"Two joysticks for boom, stick, bucket and swing; track levers; safety lock lever.",s:["Walk round and check tracks, hoses and bucket pins","Lower the safety lock and set the arm position","Position tracks parallel to the trench","Dig in layers and swing smoothly"],f:["Never swing over people","Stay clear of trench edges and cables","Lock controls when leaving"]},
{n:"Bulldozer",i:"🛠️",c:"Blade lift and tilt, steering levers, throttle and forward or reverse lever.",s:["Check tracks, blade and cooling","Lower the blade slightly when pushing","Push in straight passes","Reverse back the same path"],f:["Blade down when parked","Keep spotters outside the blade arc","Watch the slope stability"]},
{n:"Grader",i:"🛣️",c:"Blade angle and lift levers, articulated frame steering, scarifier.",s:["Inspect the blade, cutting edges and tyres","Set blade angle for the cut","Keep a steady, low speed","Finish with a light pass to leave a smooth crown"],f:["Watch for traffic on the road","Keep a safe distance from edges","Wear high-visibility clothing"]},
{n:"Forklift",i:"📦",c:"Lift and tilt levers, steering, brake and a parking brake.",s:["Check forks, chains, tyres and horn","Position forks fully under the load","Tilt back slightly, lift just above the floor","Travel with the load low; use reverse if the view is blocked"],f:["Never carry people on the forks","Respect the load capacity plate","Sound the horn at corners"]}];
var tab="learn",ex=null;
function nav(){var t=[["learn","📘 Rules"],["signs","🛑 Signs"],["veh","🚜 Vehicles"],["exam","📝 Exam"]];$("nav").innerHTML=t.map(function(x){return '<button class="'+(tab==x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")}
function go(t){tab=t;nav();draw()}
function draw(){
if(tab=="learn")$("v").innerHTML='<div class="note">Based on general Namibian road rules. Always check current law with NaTIS, the Roads Authority and the Road Traffic and Transport Act.</div>'+RU.map(function(r,i){return '<div class="c"><h3>'+(i+1)+'. '+r[0]+'</h3><p style="margin:0">'+r[1]+'</p></div>'}).join("");
if(tab=="signs")$("v").innerHTML='<div class="g">'+S.map(function(s){return '<div class="c sg">'+sig(s[0])+'<p>'+s[1]+'</p></div>'}).join("")+'</div>';
if(tab=="veh")$("v").innerHTML='<div class="note">This is theory only. Driving and operating heavy machinery legally needs a valid licence or operator certificate and supervised practice with an accredited trainer.</div>'+V.map(function(v){return '<div class="c"><h2>'+v.i+' '+v.n+'</h2><p class="m">'+v.c+'</p><b>How to operate</b><ol>'+v.s.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol><b>Safety</b><ul>'+v.f.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>'}).join("");
if(tab=="exam")exam()}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
var q=[];
RU.forEach(function(r){q.push({sec:0,q:r[0]+"?",o:r[2],a:r[3],e:r[1]})});
S.forEach(function(s){var d=shuf(S.filter(function(x){return x!==s})).slice(0,3).map(function(x){return x[1]});var o=shuf(d.concat([s[1]]));q.push({sec:1,q:"What does this sign mean?",svg:sig(s[0]),o:o,a:o.indexOf(s[1]),e:s[1]})});
VQ.forEach(function(r){q.push({sec:2,q:r[0]+"?",o:r[2],a:r[3],e:r[1]})});
return q}
function exam(){
if(!ex){$("v").innerHTML='<div class="c"><h2>Exam: 300 marks</h2><p>30 questions at 10 marks each, in three sections of 100 marks:</p><ul><li>Road rules (100)</li><li>Traffic signs (100)</li><li>Vehicle operation (100)</li></ul><p class="m">The pass mark in this app is 70% (210 of 300). It is practice only and is not an official test.</p><button class="pri" onclick="start()">Start exam</button></div>';return}
if(ex.i>=ex.q.length){var n=["Road rules","Traffic signs","Vehicle operation"],tot=ex.m[0]+ex.m[1]+ex.m[2];
$("v").innerHTML='<div class="c qs"><div class="m">Your result</div><div class="big">'+tot+' / 300</div><div class="bar"><i style="width:'+tot/3+'%"></i></div><h3 style="color:var(--'+(tot>=210?'ok':'bad')+')">'+(tot>=210?"Pass":"Not yet. Revise and retry")+'</h3>'+n.map(function(x,i){return '<div class="row" style="padding:4px 0"><span>'+x+'</span><b>'+ex.m[i]+' / 100</b></div>'}).join("")+'<br><button class="pri" onclick="start()">Try again</button></div>';return}
var q=ex.q[ex.i],done=ex.p!==null;
$("v").innerHTML='<div class="c"><div class="row m"><span>Question '+(ex.i+1)+' of 30</span><span>Score: '+(ex.m[0]+ex.m[1]+ex.m[2])+' / 300</span></div><div class="bar"><i style="width:'+ex.i/30*100+'%"></i></div><div class="qs">'+(q.svg||"")+'</div><h3>'+q.q+'</h3>'+q.o.map(function(o,i){var c="";if(done){if(i==q.a)c=" ok";else if(i==ex.p)c=" no"}return '<button class="opt'+c+'" '+(done?"disabled":"")+' onclick="pick('+i+')">'+o+'</button>'}).join("")+(done?'<p class="m">'+(ex.p==q.a?"✅ Correct, +10 marks. ":"❌ Incorrect. ")+q.e+'</p><button class="pri" onclick="nx()">'+(ex.i==29?"See result":"Next")+'</button>':'')+'</div>'}
function start(){var b=build();ex={q:[].concat(shuf(b.filter(function(x){return x.sec==0})),shuf(b.filter(function(x){return x.sec==1})),shuf(b.filter(function(x){return x.sec==2}))),i:0,p:null,m:[0,0,0]};exam()}
function pick(i){var q=ex.q[ex.i];ex.p=i;if(i==q.a)ex.m[q.sec]+=10;exam()}
function nx(){ex.i++;ex.p=null;exam();window.scrollTo(0,0)}
var LINK="https://claude.ai/artifact/DroLBTxkYW1TJCNvQPrxQK";
function showLink(){$("shm").innerHTML='Copy this link and send it to your friend:<input readonly value="'+LINK+'" onclick="this.select()" style="width:100%;margin-top:6px">'}
function share(){
var d={title:"ROBOTBOY",text:"Learn Namibian road rules, traffic signs and vehicle operation with ROBOTBOY.",url:LINK};
if(navigator.share){navigator.share(d).catch(function(e){if(!e||e.name!=="AbortError")showLink()});return}
try{navigator.clipboard.writeText(LINK).then(function(){$("shm").textContent="Link copied. Paste it into a message to your friend."},showLink)}catch(e){showLink()}}
nav();draw();
</script>
</body>
</html>
